[project]
name = "whaleshell"
version = "0.1.0a1"
description = "Python SDK for the whaleshell gateway control plane"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["whaleshell*"]
