[metadata]
name = osg
version = 0.1.0a1
description = Python SDK for the osg gateway control plane
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    httpx>=0.27

[options.extras_require]
dev =
    pytest>=8

[options.packages.find]
include =
    osg*
